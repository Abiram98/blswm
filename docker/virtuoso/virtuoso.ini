[Database]
DatabaseFile = virtuoso.db
ErrorLogFile = virtuoso.log
LockFile = virtuoso.lck
TransactionFile = virtuoso.trx
xa_persistent_file = virtuoso.pxa
ErrorLogLevel = 7
FileExtend = 200
MaxCheckpointRemap = 2000
Striping = 0
TempStorage = TempDatabase

[TempDatabase]
DatabaseFile = virtuoso-temp.db
TransactionFile = virtuoso-temp.trx
MaxCheckpointRemap = 2000
Striping = 0

[Parameters]
ServerPort = 1111
LiteMode = 0
DisableUnixSocket = 1
DisableTcpSocket = 0
MaxClientConnections = 30
CheckpointInterval = -1
O_DIRECT = 0
CaseMode = 2
MaxStaticCursorRows = 5000
CheckpointAuditTrail = 0
AllowOSCalls = 0
SchedulerInterval = 0
DirsAllowed = ., ../vad, /usr/share/proj, /import, /export
ThreadCleanupInterval = 0
ThreadThreshold = 30
ResourcesCleanupInterval = 0
FreeTextBatchSize = 100000
SingleCPU = 0
VADInstallDir = ../vad/
PrefixResultNames = 0
RdfFreeTextRulesSize = 100
IndexTreeMaps = 256
MaxMemPoolSize = 15360000000
PrefixResultNames = 0
MacSpotlight = 0
IndexTreeMaps = 256
MaxQueryMem = 16G
VectorSize = 10000
MaxVectorSize = 1000000
AdjustVectorSize = 1
ThreadsPerQuery = 16
AsyncQueueMaxThreads = 24
NumberOfBuffers = 11184810
MaxDirtyBuffers = 8388607
TraceOn = errors,ddl_log,sql_send,exec,soap

[HTTPServer]
ServerPort = 8890
ServerRoot = ../vsp
MaxClientConnections = 100
DavRoot = DAV
EnabledDavVSP = 0
HTTPProxyEnabled = 0
TempASPXDir = 0
DefaultMailServer = localhost:25
ServerThreads = 30
MaxKeepAlives = 10
KeepAliveTimeout = 5
MaxCachedProxyConnections = 10
ProxyConnectionCacheTimeout = 15
HTTPThreadSize = 280000
HttpPrintWarningsInOutput = 0
Charset = UTF-8
MaintenancePage = atomic.html
EnabledGzipContent = 1

[AutoRepair]
BadParentLinks = 0

[Client]
SQL_PREFETCH_ROWS = 100
SQL_PREFETCH_BYTES = 16000
SQL_QUERY_TIMEOUT = 0
SQL_TXN_TIMEOUT = 0

[VDB]
ArrayOptimization = 0
NumArrayParameters = 10
VDBDisconnectTimeout = 1000
KeepConnectionOnFixedThread = 0

[Replication]
ServerName = db-CENTOS5-PORT
ServerEnable = 1
QueueMax = 50000

[Striping]
Segment1 = 100M, db-seg1-1.db, db-seg1-2.db
Segment2 = 100M, db-seg2-1.db

[Zero Config]
ServerName = virtuoso (CENTOS5-PORT)

[Mono]

[URIQA]
DynamicLocal = 0
DefaultHost = localhost:8890

[SPARQL]
DefaultGraph = http://localhost:8890/dataspace
MaxQueryExecutionTime = 0
DefaultQuery = select distinct ?Concept where {[] a ?Concept} LIMIT 100
DeferInferenceRulesInit = 0

[Plugins]
LoadPath = ../hosting
Load1 = plain, geos
Load2 = plain, proj4
Load3 = plain, shapefileio
