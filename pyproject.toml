[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
[project]
name = "sparql-wm-bench"
version = "0.1.0"
description = "Standalone benchmark for learned, engine-agnostic workload management"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "pandas>=1.5"]
[project.optional-dependencies]
test = ["pytest>=7"]
tune = ["ray[tune]>=2.52,<3"]
ml = ["torch", "dgl", "jpype1", "networkx", "pandas", "scikit-learn", "scipy"]
[project.scripts]
policies = "policies.cli:main"
qpp = "qpp.cli:main"
wrk-gen = "wrk_gen.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: external services or graph toolchain required"]
