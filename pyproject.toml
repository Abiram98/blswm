[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
[project]
name = "sparql-wm-bench"
version = "0.1.0"
description = "Standalone benchmark for learned, engine-agnostic workload management"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]
[project.optional-dependencies]
test = ["pytest>=7"]
plot = ["matplotlib>=3.6"]
ml = ["torch", "dgl", "jpype1", "networkx", "pandas", "scikit-learn", "scipy"]
[project.scripts]
sparql-wm-bench = "sparql_wm_bench.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: external services or graph toolchain required"]
